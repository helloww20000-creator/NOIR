name: Build NOIR Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master, fresh-rebuild ]
permissions:
  contents: read
concurrency:
  group: noir-android-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch and build DaFit Canvas source
        run: |
          git clone --depth 1 https://github.com/e-labInnovations/DaFit-Canvas.git /tmp/dafit-canvas
          cd /tmp/dafit-canvas
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/dafit-canvas/dist/index.html")
          html = p.read_text()
          tag = '<script src="./noir-ble-shim.js"></script>'
          if tag not in html:
              html = html.replace('</head>', tag + '</head>')
          p.write_text(html)
          PY
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets/dafit"
          cp -R dist/. "$GITHUB_WORKSPACE/app/src/main/assets/dafit/"
          cp "$GITHUB_WORKSPACE/app/src/main/assets/noir-ble-shim.js" "$GITHUB_WORKSPACE/app/src/main/assets/dafit/noir-ble-shim.js"
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NOIR-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
